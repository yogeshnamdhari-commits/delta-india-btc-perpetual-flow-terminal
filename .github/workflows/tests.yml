name: Python tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Run unit and integration-contract tests
        run: python -m pytest -q
      - name: Smoke-test Streamlit server startup
        env:
          DELTA_EVENT_LOG_FILE: /tmp/delta-feed-events.jsonl
          DELTA_EVENT_LOG_FILE_FULL: /tmp/delta-feed-events-full.jsonl
          DELTA_DECISION_LOG_FILE: /tmp/signal-decisions.jsonl
        run: |
          set -euo pipefail
          python -m streamlit run app.py --server.headless true --server.address 127.0.0.1 --server.port 8502 > /tmp/delta-streamlit.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8502/_stcore/health >/dev/null; then
              echo "Streamlit server health endpoint returned HTTP 200."
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/delta-streamlit.log
              echo "Streamlit process exited before becoming healthy."
              exit 1
            fi
            sleep 1
          done
          cat /tmp/delta-streamlit.log
          echo "Streamlit server did not become healthy within 30 seconds."
          exit 1

      - name: Live Kilo Gateway free-model response smoke test
        env:
          KILO_SMOKE_PREFERRED_MODEL: nvidia/nemotron-3.5-super-vl:free
        run: |
          python - <<'PY'
          import os
          import time
          import requests

          base = "https://ai-gateway.kilo.ai/api/v1"
          preferred = os.environ.get("KILO_SMOKE_PREFERRED_MODEL", "nvidia/nemotron-3.5-super-vl:free")
          catalog_response = requests.get(f"{base}/models", timeout=15)
          catalog_response.raise_for_status()
          catalog = catalog_response.json()
          entries = catalog.get("data", []) if isinstance(catalog, dict) else []
          free_ids = [
              item.get("id") for item in entries
              if isinstance(item, dict)
              and isinstance(item.get("id"), str)
              and item["id"].endswith(":free")
          ]
          candidates = ([preferred] if preferred in free_ids else []) + [
              model_id for model_id in free_ids if model_id != preferred
          ]
          candidates = candidates[:12]
          if not candidates:
              raise SystemExit("Kilo live smoke failed: no currently listed :free model was returned by /models.")

          prompt = (
              "This is a synthetic CI connectivity test, not real market data. "
              "Reply exactly KILO_LIVE_SMOKE_OK. Dummy fixture: BTCUSD=100000."
          )
          last_error = None
          for model_id in candidates:
              started = time.monotonic()
              print(f"Trying current Kilo free model: {model_id}", flush=True)
              try:
                  response = requests.post(
                      f"{base}/chat/completions",
                      headers={"Content-Type": "application/json"},
                      json={
                          "model": model_id,
                          "messages": [{"role": "user", "content": prompt}],
                          "stream": False,
                          "temperature": 0,
                          "max_tokens": 128,
                      },
                      timeout=(10, 60),
                  )
                  if response.status_code in (400, 404, 429, 502, 503, 504):
                      last_error = f"{model_id}: HTTP {response.status_code} {response.text[:240]}"
                      continue
                  response.raise_for_status()
                  payload = response.json()
                  choices = payload.get("choices", [])
                  message = choices[0].get("message", {}) if choices and isinstance(choices[0], dict) else {}
                  answer = message.get("content", "") if isinstance(message, dict) else ""
                  if isinstance(answer, list):
                      answer = "\\n".join(
                          block.get("text", "") for block in answer
                          if isinstance(block, dict) and isinstance(block.get("text"), str)
                      )
                  if not isinstance(answer, str) or not answer.strip():
                      last_error = f"{model_id}: HTTP {response.status_code} response had no assistant text; top-level keys={list(payload)[:12]}, choices={len(choices)}"
                      print(last_error, flush=True)
                      continue
                  elapsed = round(time.monotonic() - started, 2)
                  print(f"KILO_LIVE_SMOKE_OK model={model_id} elapsed_s={elapsed} anonymous=true")
                  print("A real response was received using synthetic test data only.")
                  break
              except (requests.RequestException, ValueError) as exc:
                  last_error = f"{model_id}: {type(exc).__name__}: {str(exc)[:240]}"
                  print(last_error, flush=True)
          else:
              raise SystemExit("Kilo live response smoke test failed for all candidate free models. Last error: " + str(last_error))
          PY
